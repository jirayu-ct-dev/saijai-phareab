# docker-compose.print-test.yml — OPTIONAL overlay for docker-compose.local.yml
# that adds a full local printing test loop against the disposable demo stack:
#
#   print-seed     one-shot: registers the test Printer row (credential hash of
#                  "local-bridge-credential") via psql on the local db
#   fake-printer   TCP stand-in for the XP-C260M on port 9100 — every "print"
#                  lands as a .bin file + a log line (docker compose logs fake-printer)
#   bridge         the real print-bridge polling the local app and sending ESC/POS
#                  to the fake printer
#
# Usage:
#   docker compose -f docker-compose.local.yml up --build -d
#   docker compose -f docker-compose.local.yml -f docker-compose.print-test.yml up -d
#
# Then: register nothing (print-seed did it), create a print job from the admin
# UI, and watch `docker compose logs -f fake-printer bridge`.
# Credentials here are DEMO-ONLY — never use them outside the disposable stack.

services:
  print-seed:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - ./print-bridge/test/print-seed.sql:/print-seed.sql:ro
    entrypoint:
      - sh
      - -c
      - psql "postgresql://postgres:123@db:5432/saijai" -v ON_ERROR_STOP=1 -f /print-seed.sql

  fake-printer:
    image: node:24-alpine
    init: true
    restart: unless-stopped
    command: ["node", "/bridge/test/fake-printer.mjs"]
    volumes:
      - ./print-bridge:/bridge:ro
    expose:
      - "9100"

  bridge:
    image: node:24-alpine
    init: true
    restart: unless-stopped
    working_dir: /repo/print-bridge
    command: ["node", "bin/bridge.mjs", "--config", "test/local-test-config.json"]
    volumes:
      - .:/repo:ro
      # Outbox + received jobs must be writable inside the container.
      - print-bridge-tmp:/tmp
    environment:
      NODE_ENV: production
    depends_on:
      app:
        condition: service_started
      fake-printer:
        condition: service_started
      print-seed:
        condition: service_completed_successfully

volumes:
  print-bridge-tmp:
    name: saijai-print-bridge-tmp
