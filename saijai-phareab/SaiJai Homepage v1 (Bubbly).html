<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ใส่ใจ ผ้าเรียบ — Laundry Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    /* Logo-derived blues */
    --navy: #1B4D8C;
    --navy-deep: #143A6B;
    --navy-soft: #2E66A8;
    --cyan: #3BB7DB;
    --cyan-bright: #5FCFEE;
    --cyan-pale: #C9EBF5;

    /* Warm cream neutrals */
    --cream: #FBF7F0;
    --cream-deep: #F4EDDF;
    --cream-card: #FFFFFF;
    --ink: #0E2543;
    --ink-soft: #4A5B75;
    --line: #E8E0D0;

    /* Accents */
    --sun: #F5C24A;       /* warm accent for highlights */
    --coral: #F37A6F;     /* warning accent */

    --shadow-sm: 0 2px 6px rgba(20, 58, 107, 0.06);
    --shadow-md: 0 12px 32px -12px rgba(20, 58, 107, 0.18);
    --shadow-lg: 0 30px 60px -28px rgba(20, 58, 107, 0.30);

    --r-sm: 14px;
    --r-md: 22px;
    --r-lg: 32px;
    --r-xl: 44px;

    --bg: var(--cream);
    --bg-alt: var(--cream-deep);
    --card: var(--cream-card);
    --text: var(--ink);
    --text-soft: var(--ink-soft);
    --border: var(--line);
  }

  [data-theme="dark"] {
    --bg: #0B1B33;
    --bg-alt: #0F2342;
    --card: #163057;
    --text: #F4EDDF;
    --text-soft: #B6C4DC;
    --border: rgba(255,255,255,0.08);
    --navy: #5FCFEE;
    --navy-deep: #C9EBF5;
    --navy-soft: #8FDBEF;
    --cream-deep: #0F2342;
    --shadow-sm: 0 2px 6px rgba(0,0,0,0.3);
    --shadow-md: 0 12px 32px -12px rgba(0,0,0,0.5);
    --shadow-lg: 0 30px 60px -28px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Prompt', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.6;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.4s ease;
    overflow-x: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Layout */
  .wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  @media (min-width: 760px) { .wrap { padding: 0 32px; } }

  section { position: relative; }

  /* ======== TOP NAV ======== */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
  .brand img { height: 44px; width: auto; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
  .brand-name { font-weight: 700; font-size: 18px; color: var(--navy); }
  .brand-sub { font-size: 11px; letter-spacing: 0.18em; color: var(--text-soft); text-transform: uppercase; }
  .nav-links { display: none; gap: 28px; }
  .nav-links a { color: var(--text-soft); text-decoration: none; font-weight: 500; font-size: 14px; }
  .nav-links a:hover { color: var(--navy); }
  @media (min-width: 880px) { .nav-links { display: flex; } }

  .pill-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 999px;
    background: var(--navy); color: white;
    font-weight: 600; font-size: 14px;
    border: none; cursor: pointer; text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .pill-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .pill-btn.lg { padding: 16px 28px; font-size: 16px; }
  .pill-btn.outline { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  .pill-btn.line {
    background: #06C755; color: white;
  }
  .pill-btn.line:hover { background: #05B04C; }

  /* ======== HERO ======== */
  .hero {
    padding: 32px 0 60px;
    position: relative;
  }
  .hero-grid {
    display: grid; gap: 32px;
    grid-template-columns: 1fr;
    align-items: center;
  }
  @media (min-width: 880px) {
    .hero { padding: 60px 0 100px; }
    .hero-grid { grid-template-columns: 1.1fr 1fr; gap: 48px; }
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: color-mix(in srgb, var(--cyan-pale) 70%, transparent);
    color: var(--navy-deep);
    padding: 7px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
  }
  [data-theme="dark"] .hero-eyebrow {
    background: color-mix(in srgb, var(--navy) 25%, transparent);
    color: var(--cyan-pale);
  }
  .hero-eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); }
  .hero h1 {
    margin: 18px 0 16px;
    font-size: clamp(38px, 7vw, 68px);
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .hero h1 .accent { color: var(--navy); }
  .hero h1 .splash {
    color: var(--cyan);
    position: relative;
    display: inline-block;
  }
  .hero p.lead {
    font-size: clamp(16px, 2vw, 19px);
    color: var(--text-soft);
    max-width: 540px;
    margin: 0 0 28px;
    line-height: 1.6;
  }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }

  .hero-meta {
    display: flex; flex-wrap: wrap; gap: 22px 32px;
    margin-top: 36px; padding-top: 28px;
    border-top: 1px dashed var(--border);
  }
  .hero-meta-item .num {
    font-size: 26px; font-weight: 700; color: var(--navy);
    line-height: 1;
  }
  .hero-meta-item .lbl {
    font-size: 12px; color: var(--text-soft);
    margin-top: 6px; text-transform: uppercase; letter-spacing: 0.12em;
  }

  /* Hero visual: bubbly composition */
  .hero-visual {
    position: relative;
    aspect-ratio: 1 / 1;
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
  }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(0.3px);
  }
  .blob-1 {
    inset: 8% 8% auto auto; width: 78%; aspect-ratio: 1;
    background: radial-gradient(circle at 32% 28%, var(--cyan-bright), var(--cyan) 55%, var(--navy-soft) 100%);
    box-shadow: inset -20px -30px 60px rgba(0,0,0,0.18), 0 30px 70px -20px rgba(27,77,140,0.45);
  }
  .blob-2 {
    bottom: 4%; left: 0; width: 42%; aspect-ratio: 1;
    background: radial-gradient(circle at 35% 30%, #fff, var(--cyan-pale) 60%, var(--cyan) 110%);
    box-shadow: inset -10px -14px 30px rgba(0,0,0,0.10), 0 20px 50px -16px rgba(27,77,140,0.30);
  }
  .blob-3 {
    top: 0; left: 12%; width: 18%; aspect-ratio: 1;
    background: radial-gradient(circle at 35% 30%, #fff, var(--cyan-pale) 70%, var(--cyan-bright) 110%);
    opacity: 0.85;
  }
  .blob-4 {
    top: 50%; left: 4%; width: 10%; aspect-ratio: 1;
    background: var(--sun);
    opacity: 0.9;
  }
  .hero-photo {
    position: absolute; inset: 18% 14% 14% 18%;
    border-radius: var(--r-xl);
    background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--navy) 14%, transparent) 0 8px, transparent 8px 18px), color-mix(in srgb, var(--cream-deep) 70%, white);
    border: 1.5px dashed color-mix(in srgb, var(--navy) 35%, transparent);
    display: flex; align-items: center; justify-content: center;
    color: var(--navy-deep);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-align: center;
    padding: 16px;
    box-shadow: var(--shadow-md);
    transform: rotate(-3deg);
  }
  [data-theme="dark"] .hero-photo {
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 8px, transparent 8px 18px), rgba(255,255,255,0.02);
    border-color: rgba(255,255,255,0.25);
    color: var(--cyan-pale);
  }

  /* Soft floating bubbles in hero bg */
  .ambient-bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .ambient-bubbles span {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), color-mix(in srgb, var(--cyan-pale) 80%, transparent));
    opacity: 0.55;
  }
  [data-theme="dark"] .ambient-bubbles span {
    background: radial-gradient(circle at 30% 30%, rgba(95,207,238,0.4), rgba(95,207,238,0.05));
    opacity: 0.4;
  }

  /* ======== SECTION HEADER ======== */
  .sect-head { margin-bottom: 36px; }
  .sect-eyebrow {
    display: inline-block;
    color: var(--cyan);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .sect-title {
    font-size: clamp(28px, 4.5vw, 44px);
    font-weight: 700;
    line-height: 1.1;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .sect-sub {
    color: var(--text-soft);
    max-width: 620px;
    font-size: 16px;
    margin: 0;
  }

  /* ======== SERVICES ======== */
  .services { padding: 60px 0; }
  .svc-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 600px) { .svc-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .svc-grid { grid-template-columns: repeat(4, 1fr); } }

  .svc-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 28px 24px 24px;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .svc-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: color-mix(in srgb, var(--cyan) 40%, transparent);
  }
  .svc-icon {
    width: 56px; height: 56px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    background: var(--cyan-pale);
    color: var(--navy-deep);
    margin-bottom: 18px;
  }
  [data-theme="dark"] .svc-icon { background: color-mix(in srgb, var(--cyan) 25%, transparent); color: var(--cyan-pale); }
  .svc-card h3 { margin: 0 0 6px; font-size: 19px; font-weight: 600; color: var(--text); }
  .svc-card .th-sub { color: var(--cyan); font-size: 13px; font-weight: 500; margin-bottom: 10px; }
  .svc-card p { margin: 0; color: var(--text-soft); font-size: 14px; line-height: 1.55; }

  /* ======== PACKAGES ======== */
  .packages {
    padding: 80px 0;
    background: var(--bg-alt);
    border-radius: var(--r-xl);
    margin: 40px 12px;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 760px) { .packages { margin: 60px 24px; } }

  .pkg-grid {
    display: grid; grid-template-columns: 1fr; gap: 20px;
    margin-top: 8px;
  }
  @media (min-width: 800px) { .pkg-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; } }

  .pkg {
    background: var(--card);
    border-radius: var(--r-lg);
    padding: 32px 28px 28px;
    border: 1px solid var(--border);
    position: relative;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-sm);
  }
  .pkg.featured {
    background: var(--navy);
    color: white;
    border: none;
    box-shadow: var(--shadow-lg);
    transform: translateY(-4px);
  }
  .pkg.featured .pkg-name,
  .pkg.featured .pkg-tag,
  .pkg.featured .pkg-price,
  .pkg.featured ul li { color: white; }
  .pkg.featured .pkg-tag-bg { background: var(--cyan); color: var(--navy-deep); }
  .pkg.featured .pkg-bath { color: var(--cyan-pale); }
  .pkg.featured ul li svg { color: var(--cyan-bright); }
  .pkg.featured .pill-btn { background: var(--cyan); color: var(--navy-deep); }

  .pkg-tag {
    position: absolute; top: -14px; left: 28px;
    padding: 6px 14px; border-radius: 999px;
    background: var(--sun); color: var(--ink);
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  }
  .pkg-name {
    font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft); font-weight: 600; margin: 0 0 4px;
  }
  .pkg-th-name { font-size: 26px; font-weight: 700; margin: 0 0 18px; color: var(--text); }
  .pkg.featured .pkg-th-name { color: white; }
  .pkg-price {
    display: flex; align-items: baseline; gap: 6px;
    margin-bottom: 4px;
  }
  .pkg-price .num { font-size: 48px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: var(--text); }
  .pkg-bath { font-size: 16px; color: var(--text-soft); }
  .pkg-period { color: var(--text-soft); font-size: 14px; margin-bottom: 24px; }
  .pkg.featured .pkg-period { color: var(--cyan-pale); }

  .pkg ul { list-style: none; padding: 0; margin: 0 0 28px; flex: 1; }
  .pkg ul li {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0;
    font-size: 15px;
    color: var(--text);
    border-bottom: 1px dashed color-mix(in srgb, var(--border) 80%, transparent);
  }
  .pkg.featured ul li { border-bottom-color: rgba(255,255,255,0.12); }
  .pkg ul li:last-child { border-bottom: none; }
  .pkg ul li svg { flex-shrink: 0; margin-top: 3px; color: var(--cyan); }

  .pkg .pill-btn { width: 100%; justify-content: center; }

  /* Disclaimers */
  .disclaimers { display: grid; gap: 14px; margin-top: 32px; }
  @media (min-width: 760px) { .disclaimers { grid-template-columns: 1fr 1fr; } }
  .disclaim {
    display: flex; gap: 14px;
    padding: 18px 20px;
    background: color-mix(in srgb, var(--sun) 18%, var(--card));
    border: 1px solid color-mix(in srgb, var(--sun) 40%, transparent);
    border-radius: var(--r-md);
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
  }
  [data-theme="dark"] .disclaim {
    background: color-mix(in srgb, var(--sun) 12%, var(--card));
  }
  .disclaim-icon {
    flex-shrink: 0; width: 32px; height: 32px;
    background: var(--sun); color: var(--ink);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }

  /* ======== WALK-IN PRICING ======== */
  .walkin { padding: 80px 0; }

  .walkin-headline {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
    color: white;
    border-radius: var(--r-lg);
    padding: 32px;
    margin-bottom: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 760px) {
    .walkin-headline { flex-direction: row; align-items: center; justify-content: space-between; padding: 40px; }
  }
  .walkin-headline::after {
    content: ''; position: absolute;
    right: -60px; top: -60px;
    width: 220px; height: 220px;
    background: radial-gradient(circle at 30% 30%, var(--cyan-bright), var(--cyan) 60%, transparent 75%);
    opacity: 0.5;
    border-radius: 50%;
    pointer-events: none;
  }
  .walkin-headline > * { position: relative; z-index: 1; }
  .walkin-headline .lbl { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.8; margin-bottom: 6px; }
  .walkin-headline .price-big {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 56px; font-weight: 700; letter-spacing: -0.02em; line-height: 1;
  }
  .walkin-headline .price-big small { font-size: 18px; opacity: 0.85; font-weight: 500; }
  .walkin-headline p { margin: 0; opacity: 0.85; max-width: 380px; line-height: 1.5; }

  /* Service-by-garment table */
  .price-table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    margin-bottom: 24px;
  }
  .price-table-head {
    padding: 22px 24px 14px;
    border-bottom: 1px solid var(--border);
  }
  .price-table-head h3 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
  .price-table-head p { margin: 0; color: var(--text-soft); font-size: 14px; }

  .price-table { width: 100%; border-collapse: collapse; }
  .price-table thead th {
    text-align: right;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text-soft);
    padding: 14px 12px;
    background: color-mix(in srgb, var(--cream-deep) 60%, transparent);
    border-bottom: 1px solid var(--border);
  }
  [data-theme="dark"] .price-table thead th { background: rgba(255,255,255,0.03); }
  .price-table thead th:first-child { text-align: left; padding-left: 24px; }
  .price-table thead th:last-child { padding-right: 24px; }
  .price-table tbody td {
    padding: 16px 12px;
    border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    color: var(--text);
  }
  .price-table tbody tr:last-child td { border-bottom: none; }
  .price-table tbody td:first-child {
    text-align: left;
    padding-left: 24px;
    font-weight: 600;
    display: flex; align-items: center; gap: 12px;
  }
  .price-table tbody td:last-child { padding-right: 24px; }
  .price-table tbody tr:hover td { background: color-mix(in srgb, var(--cyan-pale) 30%, transparent); }
  [data-theme="dark"] .price-table tbody tr:hover td { background: rgba(95,207,238,0.06); }
  .price-table .item-icon {
    width: 32px; height: 32px; border-radius: 10px;
    background: var(--cyan-pale); color: var(--navy-deep);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  [data-theme="dark"] .price-table .item-icon { background: color-mix(in srgb, var(--cyan) 25%, transparent); color: var(--cyan-pale); }
  .price-table .em-dash { color: color-mix(in srgb, var(--text-soft) 50%, transparent); }

  /* Mobile: cards instead of table */
  .price-cards { display: none; }
  @media (max-width: 720px) {
    .price-table { display: none; }
    .price-cards { display: grid; gap: 12px; padding: 16px; }
    .price-cards .row {
      background: color-mix(in srgb, var(--cream-deep) 50%, transparent);
      padding: 14px 16px; border-radius: var(--r-md);
    }
    [data-theme="dark"] .price-cards .row { background: rgba(255,255,255,0.03); }
    .price-cards .row-head {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; margin-bottom: 8px;
    }
    .price-cards .row-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px;
      font-size: 14px;
    }
    .price-cards .price-cell { display: flex; justify-content: space-between; }
    .price-cards .price-cell .lbl { color: var(--text-soft); font-size: 12px; }
    .price-cards .price-cell .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  }

  /* Notice box */
  .notice {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--coral);
    border-radius: var(--r-md);
    padding: 24px 24px 22px;
    margin-top: 28px;
  }
  .notice-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .notice-head .badge {
    width: 28px; height: 28px; border-radius: 8px;
    background: color-mix(in srgb, var(--coral) 20%, transparent);
    color: var(--coral);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .notice ul { list-style: none; padding: 0; margin: 0; }

/* =============== APP =============== */
function App() {
  const defaults = JSON.parse(document.getElementById('tweak-defaults').textContent.replace(/\/\*EDITMODE-(BEGIN|END)\*\//g, ''));
  const [theme, setTheme] = useState(defaults.theme || 'light');
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    window.parent.postMessage({type: '__edit_mode_set_keys', edits: { theme }}, '*');
  }, [theme]);

  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      else if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({type: '__edit_mode_available'}, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const closeTweaks = () => {
    setTweaksVisible(false);
    window.parent.postMessage({type: '__edit_mode_dismissed'}, '*');
  };

  return (
    <>
      <Nav theme={theme} setTheme={setTheme}/>
      <Hero/>
      <Services/>
      <Packages/>
      <Walkin/>
      <Delivery/>
      <FAQ/>
      <Contact/>
      <Foot/>
      <TweakPanel visible={tweaksVisible} onClose={closeTweaks} theme={theme} setTheme={setTheme}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
